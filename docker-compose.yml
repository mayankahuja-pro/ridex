services:
  postgres:
    image: postgres:16
    container_name: ridex_postgres
    restart: always
    environment:
      POSTGRES_USER: ridex
      POSTGRES_PASSWORD: ridex_password
      POSTGRES_DB: ridex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ridex_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: